name: Снимок котировок

on:
  schedule:
    # 10:05, 13:05, 16:05, 19:05, 22:05 по Москве (UTC+3), будни
    - cron: "5 7,10,13,16,19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Котировки Мосбиржи
        run: python scripts/snapshot.py

      - name: Дивиденды (раз в день, первый запуск)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 7,10,13,16,19 * * 1-5'
        run: |
          if [ "$(TZ=Europe/Moscow date +%H)" -lt 11 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/dividends.py
          fi

      - name: Сохранить данные
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Нет изменений"; exit 0; fi
          git commit -m "Снимок $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M')"
          git pull --rebase origin main
          git push
